<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Achadinhos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .admin-box { width: 100%; max-width: 650px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #ff4757; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }
        .btn:hover { background: #ff3838; }
        .loading { text-align: center; color: #005bed; font-weight: bold; margin-top: 10px; display: none; }
        
        /* Danh sách sản phẩm trong admin để xóa */
        .admin-list { margin-top: 30px; border-top: 2px solid #eee; padding-top: 15px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
        .btn-del { background: #e53935; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-del:hover { background: #c62828; }
    </style>
</head>
<body>

<div class="admin-box">
    <h1>🛠️ Quản Trị Sản Phẩm (Cloud Sync)</h1>
    
    <div class="form-group">
        <label>Bin ID hiện tại (Đã cố định):</label>
        <input type="text" id="binId" value="6abf812cffd5d16053458888" disabled style="background:#e9ecef; color:#666;">
    </div>

    <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">

    <div class="form-group">
        <label>Danh mục sản phẩm:</label>
        <select id="pCategory">
            <option value="hot">🔥 Hot Sale / Mais Vendidos</option>
            <option value="util">💧 Utilidades do Dia a Dia</option>
            <option value="tech">⌚ Eletrônicos & Smartwatch</option>
        </select>
    </div>

    <div class="form-group">
        <label>Tên sản phẩm:</label>
        <input type="text" id="pTitle" placeholder="Ví dụ: Copo Térmico Inox 1.2L">
    </div>

    <div class="form-group">
        <label>Link hình ảnh sản phẩm (URL ảnh):</label>
        <input type="text" id="pImage" placeholder="https://images.unsplash.com/...">
    </div>

    <div class="form-group">
        <label>Link mua hàng (Affiliate Link):</label>
        <input type="text" id="pLink" placeholder="https://s.click.aliexpress.com/e/...">
    </div>

    <div class="form-group">
        <label>Giá hiện tại (Main Price):</label>
        <input type="text" id="pMainPrice" placeholder="R$ 39,90">
    </div>

    <div class="form-group">
        <label>Giá gốc & Nhãn giảm giá:</label>
        <input type="text" id="pSubPrice" placeholder="R$ 120,00" style="margin-bottom:5px;">
        <input type="text" id="pBadge" placeholder="Nhãn (VD: 70% OFF)">
    </div>

    <button class="btn" onclick="addNewProduct()">➕ Thêm Sản Phẩm Mới Lên Mây</button>
    <div id="loadingText" class="loading">Đang đồng bộ dữ liệu, vui lòng đợi...</div>

    <div class="admin-list">
        <h3>📋 Danh sách sản phẩm trên mây (Bấm xóa để gỡ bỏ):</h3>
        <div id="currentProductsList" style="margin-top: 10px;">Đang tải danh sách...</div>
    </div>
</div>

<script>
    const ADMIN_PASS = "123456"; // Mật khẩu quản trị của bạn
    const BIN_ID = "6abf812cffd5d16053458888";
    const MASTER_KEY = "$2a$10$ka6PM2vVBDDaDoirSLIys.sa0GccPv63vO5SIH936dSZh3tu4O.Sq"; // (Hãy thay bằng Master Key thật của bạn từ JSONBin)

    let enteredPass = prompt("Nhập mật khẩu quản trị (Mặc định: 123456):");
    if (enteredPass !== ADMIN_PASS) {
        alert("Sai mật khẩu!");
        document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>Truy cập bị từ chối ❌</h2>";
        throw new Error("Unauthorized");
    }

    let cloudProducts = [];

    // Tải danh sách sản phẩm hiện có từ mây khi vừa mở trang
    async function loadAdminData() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            let data = await res.json();
            cloudProducts = data.record.products || [];
            renderAdminList();
        } catch (err) {
            document.getElementById('currentProductsList').innerHTML = "Lỗi tải dữ liệu từ mây. Hãy kiểm tra lại Master Key trong code.";
        }
    }

    function renderAdminList() {
        const listDiv = document.getElementById('currentProductsList');
        listDiv.innerHTML = '';
        if (cloudProducts.length === 0) {
            listDiv.innerHTML = "<p style='color:#666;'>Chưa có sản phẩm nào.</p>";
            return;
        }
        cloudProducts.forEach((p, index) => {
            listDiv.innerHTML += `
                <div class="admin-item">
                    <span><b>[${p.category.toUpperCase()}]</b> ${p.title} (${p.mainPrice})</span>
                    <button class="btn-del" onclick="deleteProduct(${index})">🗑️ Xóa</button>
                </div>
            `;
        });
    }

    async function addNewProduct() {
        const newItem = {
            id: Date.now(),
            category: document.getElementById('pCategory').value,
            title: document.getElementById('pTitle').value,
            image: document.getElementById('pImage').value,
            link: document.getElementById('pLink').value,
            mainPrice: document.getElementById('pMainPrice').value,
            subPrice: document.getElementById('pSubPrice').value,
            badge: document.getElementById('pBadge').value || "SALE",
            rating: "4.9",
            sold: "2k+"
        };

        if(!newItem.title || !newItem.link) {
            alert("Vui lòng điền tên và link sản phẩm!");
            return;
        }

        cloudProducts.push(newItem);
        await saveToCloud("Thêm sản phẩm thành công!");
        
        // Reset form
        document.getElementById('pTitle').value = '';
        document.getElementById('pImage').value = '';
        document.getElementById('pLink').value = '';
        document.getElementById('pMainPrice').value = '';
        document.getElementById('pSubPrice').value = '';
        document.getElementById('pBadge').value = '';
    }

    async function deleteProduct(index) {
        if(!confirm("Bạn có chắc chắn muốn xóa sản phẩm này không?")) return;
        cloudProducts.splice(index, 1);
        await saveToCloud("Đã xóa sản phẩm thành công!");
    }

    async function saveToCloud(successMsg) {
        document.getElementById('loadingText').style.display = 'block';
        try {
            let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify({ products: cloudProducts })
            });

            if(updateRes.ok) {
                alert(successMsg);
                renderAdminList();
            } else {
                alert("Lỗi lưu dữ liệu. Hãy kiểm tra lại Master Key!");
            }
        } catch (err) {
            alert("Lỗi kết nối mạng.");
        } finally {
            document.getElementById('loadingText').style.display = 'none';
        }
    }

    loadAdminData();
</script>
</body>
</html>
