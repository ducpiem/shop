<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Cloud Sync</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .admin-box { width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #ff4757; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }
        .btn:hover { background: #ff3838; }
        .loading { text-align: center; color: #005bed; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="admin-box">
    <h1>☁️ Quản Trị Cloud (Đồng bộ thời gian thực)</h1>
    
    <div class="form-group">
        <label>JSONBin Bin ID (Mã kho chứa data của bạn):</label>
        <input type="text" id="binId" placeholder="6abf812cffd5d16053458888" value="">
        <small style="color:#666; font-size:11px;">Mã định danh kho chứa dữ liệu trên JSONBin.io của bạn.</small>
    </div>

    <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">

    <div class="form-group">
        <label>Danh mục sản phẩm:</label>
        <select id="pCategory">
            <option value="hot">🔥 Hot Sale / Mais Vendidos</option>
            <option value="util">💧 Utilidades do Dia a Dia</option>
            <option value="tech">⌚ Eletrônicos & Smartwatch</option>
        </select>
    </div>

    <div class="form-group">
        <label>Tên sản phẩm:</label>
        <input type="text" id="pTitle" placeholder="Ví dụ: Copo Térmico Inox 1.2L">
    </div>

    <div class="form-group">
        <label>Link hình ảnh sản phẩm (URL ảnh):</label>
        <input type="text" id="pImage" placeholder="https://images.unsplash.com/...">
    </div>

    <div class="form-group">
        <label>Link mua hàng (Affiliate Link):</label>
        <input type="text" id="pLink" placeholder="https://s.click.aliexpress.com/e/...">
    </div>

    <div class="form-group">
        <label>Giá hiện tại (Main Price):</label>
        <input type="text" id="pMainPrice" placeholder="R$ 39,90">
    </div>

    <div class="form-group">
        <label>Giá gốc / Giảm giá (Sub Price & Badge):</label>
        <input type="text" id="pSubPrice" placeholder="R$ 120,00" style="margin-bottom:5px;">
        <input type="text" id="pBadge" placeholder="Nhãn (VD: 70% OFF)">
    </div>

    <button class="btn" onclick="uploadToCloud()">🚀 Lưu & Đồng Bộ Lên Mây</button>
    <div id="loadingText" class="loading">Đang đẩy dữ liệu lên mây, vui lòng đợi...</div>
</div>

<script>
    // 1. MẬT KHẨU QUẢN TRỊ (Bạn có thể sửa lại chuỗi này thành mật khẩu tùy ý)
    const ADMIN_PASS = "123456"; 

    let enteredPass = prompt("Nhập mật khẩu quản trị (Mặc định: 123456):");
    if (enteredPass !== ADMIN_PASS) {
        alert("Sai mật khẩu! Bạn không có quyền truy cập.");
        document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px; color:red;'>Truy cập bị từ chối ❌</h2>";
        throw new Error("Unauthorized");
    }

    // 2. 🔑 HÃY THAY MÃ MASTER KEY CỦA BẠN VÀO ĐÂY
    const MASTER_KEY = "$2a$10$ka6PM2vVBDDaDoirSLIys.sa0GccPv63vO5SIH936dSZh3tu4O.Sq"; 

    async function uploadToCloud() {
        const binId = document.getElementById('binId').value.trim();
        if(!binId) {
            alert("Vui lòng nhập Bin ID của bạn trên JSONBin!");
            return;
        }

        const newItem = {
            id: Date.now(),
            category: document.getElementById('pCategory').value,
            title: document.getElementById('pTitle').value,
            image: document.getElementById('pImage').value,
            link: document.getElementById('pLink').value,
            mainPrice: document.getElementById('pMainPrice').value,
            subPrice: document.getElementById('pSubPrice').value,
            badge: document.getElementById('pBadge').value || "SALE",
            rating: "4.9",
            sold: "2k+"
        };

        if(!newItem.title || !newItem.link) {
            alert("Vui lòng điền tên và link sản phẩm!");
            return;
        }

        document.getElementById('loadingText').style.display = 'block';

        try {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            let data = await response.json();
            let currentProducts = data.record.products || [];

            currentProducts.push(newItem);

            let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify({ products: currentProducts })
            });

            if(updateRes.ok) {
                alert("Đồng bộ thành công! Sản phẩm đã xuất hiện trên trang khách xem.");
                document.getElementById('pTitle').value = '';
                document.getElementById('pImage').value = '';
                document.getElementById('pLink').value = '';
                document.getElementById('pMainPrice').value = '';
                document.getElementById('pSubPrice').value = '';
                document.getElementById('pBadge').value = '';
            } else {
                alert("Lỗi khi lưu dữ liệu lên mây. Kiểm tra lại Master Key hoặc Bin ID!");
            }
        } catch (err) {
            console.error(err);
            alert("Có lỗi kết nối mạng xảy ra.");
        } finally {
            document.getElementById('loadingText').style.display = 'none';
        }
    }
</script>
</body>
</html>
