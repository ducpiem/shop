<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin - Quản Trị Hệ Thống Bio</title>
    <link rel="icon" href="https://raw.githubusercontent.com/ducpiem/ducpm/refs/heads/ducpiem/Dlogo-removebg-preview.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0c0d14; color: #fff; padding: 20px; display: flex; justify-content: center; }
        
        /* KHUNG ĐĂNG NHẬP BẢO MẬT */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0c0d14; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #161822; padding: 30px; border-radius: 12px; border: 1px solid #2a2d3d; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; }
        .login-box h2 { color: #ff4757; margin-bottom: 20px; font-size: 20px; }

        .admin-box { width: 100%; max-width: 700px; background: #161822; padding: 25px; border-radius: 14px; border: 1px solid #2a2d3d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; }
        h1 { font-size: 22px; margin-bottom: 20px; color: #ff4757; text-align: center; }
        .section-box { background: #1e2130; padding: 18px; border-radius: 10px; border: 1px solid #2f3348; margin-bottom: 20px; }
        .section-box h3 { font-size: 15px; margin-bottom: 12px; color: #a4b0be; border-bottom: 1px solid #2f3348; padding-bottom: 6px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 4px; color: #ced6e0; }
        input, select { width: 100%; padding: 10px; border: 1px solid #3f445d; background: #0c0d14; color: #fff; border-radius: 6px; font-size: 13px; }
        input:focus, select:focus { border-color: #ff4757; outline: none; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-with-toggle { display: flex; gap: 8px; }
        .input-with-toggle input { flex: 1; }
        .input-with-toggle select { width: 90px; background: #2f3640; border: 1px solid #7f8fa6; font-weight: bold; }
        
        .btn { background: #ff4757; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; margin-top: 5px; transition: 0.2s; }
        .btn:hover { background: #ff3838; }
        .btn-profile { background: #2ed573; color: #000; }
        .btn-profile:hover { background: #26af5f; }
        
        .loading { text-align: center; color: #70a1ff; font-weight: bold; margin-top: 10px; display: none; }
        
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #12141d; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; border: 1px solid #262938; }
        .item-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .item-img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; border: 1px solid #3f445d; }
        .item-text { display: flex; flex-direction: column; gap: 4px; }
        
        .btn-action-group { display: flex; gap: 6px; }
        .btn-edit { background: #f39c12; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-edit:hover { background: #e67e22; }
        .btn-del { background: #e53935; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-del:hover { background: #c62828; }
    </style>
</head>
<body>

<!-- KHUNG ĐĂNG NHẬP BẢO MẬT ADMIN -->
<div id="loginOverlay">
    <div class="login-box">
        <h2>🔐 ĐĂNG NHẬP ADMIN</h2>
        <div class="form-group"><label>Tài khoản:</label><input type="text" id="authUser" placeholder="Nhập tài khoản"></div>
        <div class="form-group"><label>Mật khẩu:</label><input type="password" id="authPass" placeholder="Nhập mật khẩu"></div>
        <button class="btn" onclick="checkLogin()">Đăng Nhập Quản Trị</button>
        <p id="loginError" style="color:#ff4757; font-size:12px; margin-top:10px; display:none;">Sai tài khoản hoặc mật khẩu!</p>
    </div>
</div>

<div class="admin-box" id="adminMainContent">
    <h1>🛠️ BẢNG QUẢN TRỊ MASTER BIO</h1>
    
    <div class="section-box">
        <h3>👤 Chỉnh sửa Thông tin Bio & Chân trang</h3>
        <div class="form-group"><label>Tên Shop / Kênh:</label><input type="text" id="ownerName"></div>
        <div class="form-group"><label>Link ảnh đại diện (Avatar URL):</label><input type="text" id="ownerAvatar"></div>
        <div class="form-group"><label>Thông báo uy tín (Dưới tên):</label><input type="text" id="ownerSecure"></div>
        <div class="form-group"><label>Thông tin Copyright:</label><input type="text" id="copyrightTxt"></div>
        <button class="btn btn-profile" onclick="updateProfile()">💾 Lưu Cài Đặt Bio</button>
    </div>

    <div class="section-box">
        <h3>🌐 Cấu hình Mạng Xã Hội (Độc lập Ẩn/Hiện)</h3>
        <div class="row">
            <div class="form-group">
                <label style="color:#1877F2;">📘 Facebook:</label>
                <div class="input-with-toggle">
                    <input type="text" id="socFb" placeholder="Link FB">
                    <select id="showFb"><option value="true">👁️ Hiện</option><option value="false">🚫 Ẩn</option></select>
                </div>
            </div>
            <div class="form-group">
                <label style="color:#00f2fe;">🎵 TikTok:</label>
                <div class="input-with-toggle">
                    <input type="text" id="socTt" placeholder="Link TikTok">
                    <select id="showTt"><option value="true">👁️️ Hiện</option><option value="false">🚫 Ẩn</option></select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label style="color:#e84393;">📸 Instagram:</label>
                <div class="input-with-toggle">
                    <input type="text" id="socIg" placeholder="Link IG">
                    <select id="showIg"><option value="true">👁️ Hiện</option><option value="false">🚫 Ẩn</option></select>
                </div>
            </div>
            <div class="form-group">
                <label style="color:#ff0000;">▶️ YouTube:</label>
                <div class="input-with-toggle">
                    <input type="text" id="socYt" placeholder="Link YT">
                    <select id="showYt"><option value="true">👁️ Hiện</option><option value="false">🚫 Ẩn</option></select>
                </div>
            </div>
        </div>
        <button class="btn btn-profile" onclick="updateSocials()" style="background:#3742fa; color:#fff;">💾 Lưu Mạng Xã Hội</button>
    </div>

    <div class="section-box" id="catSectionBox">
        <h3 id="catFormTitle">📂 Quản Lý Danh Mục (Thêm / Sửa / Xóa)</h3>
        <div class="row">
            <div class="form-group"><label>Tên danh mục:</label><input type="text" id="catName" placeholder="VD: Sạc & Cáp"></div>
            <div class="form-group"><label>Icon (Emoji):</label><input type="text" id="catIcon" placeholder="VD: ⚡"></div>
        </div>
        <button class="btn btn-profile" id="btnSaveCat" onclick="saveCategoryAction()" style="background:#0984e3; color:#fff;">➕ Thêm Danh Mục Mới</button>
        <button class="btn" id="btnCancelCat" onclick="cancelCatEdit()" style="background:#747d8c; display:none; margin-top:5px;">❌ Hủy Sửa Danh Mục</button>
        <div id="categoryListAdmin" style="margin-top: 15px;"></div>
    </div>

    <div class="section-box" id="productFormSection">
        <h3 id="formTitle">📦 Thêm / Sửa Sản Phẩm</h3>
        <div class="form-group">
            <label>Chọn danh mục cho sản phẩm:</label>
            <select id="pCategorySelect"></select>
        </div>
        <div class="form-group"><label>Tên sản phẩm:</label><input type="text" id="pTitle"></div>
        <div class="row">
            <div class="form-group"><label>Giá hiện tại (Số, VD: 9.99):</label><input type="text" id="pMainPrice" oninput="autoCalculateBadge()"></div>
            <div class="form-group"><label>Giá gốc (Số, VD: 35.00):</label><input type="text" id="pSubPrice" oninput="autoCalculateBadge()"></div>
        </div>
        <div class="form-group"><label>Nhãn giảm giá:</label><input type="text" id="pBadge" placeholder="VD: 71% OFF"></div>
        <div class="form-group"><label>Link hình ảnh sản phẩm:</label><input type="text" id="pImage"></div>
        <div class="form-group"><label>Link mua hàng (Affiliate):</label><input type="text" id="pLink"></div>
        
        <button class="btn" id="btnSubmitProduct" onclick="saveProductAction()">➕ Thêm Sản Phẩm Lên Mây</button>
        <button class="btn" id="btnCancelEdit" onclick="cancelEdit()" style="background:#747d8c; display:none;">❌ Hủy Chỉnh Sửa</button>
    </div>

    <div id="loadingText" class="loading">Đang đồng bộ dữ liệu với mây...</div>

    <div style="margin-top: 15px;">
        <h3>📋 Danh sách sản phẩm hiện tại:</h3>
        <div id="currentProductsList" style="margin-top: 10px;">Đang tải...</div>
    </div>
</div>

<script>
    const BIN_ID = "6abf8b69ffd5d1605345a07d";
    const MASTER_KEY = "$2a$10$ka6PM2vVBDDaDoirSLIys.sa0GccPv63vO5SIH936dSZh3tu4O.Sq";

    // TÀI KHOẢN VÀ MẬT KHẨU QUẢN TRỊ (BẠN CÓ THỂ ĐỔI Ở ĐÂY)
    const ADMIN_USER = "ducpm";
    const ADMIN_PASS = "admin123";

    function checkLogin() {
        let u = document.getElementById('authUser').value.trim();
        let p = document.getElementById('authPass').value.trim();
        if(u === ADMIN_USER && p === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminMainContent').style.display = 'block';
            loadAdminData();
        } else {
            let err = document.getElementById('loginError');
            err.style.display = 'block';
        }
    }

    let cloudData = { profile: {}, socials: {}, categories: [], products: [] };
    let editIndex = -1;
    let editCatIndex = -1;

    const defaultCategories = [
        { name: "all", label: "Tất cả" },
        { name: "discount50", label: "Giảm 50%+" },
        { name: "freeship", label: "Free Ship" },
        { name: "under10", label: "Dưới $10" }
    ];

    async function loadAdminData() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
            let data = await res.json();
            cloudData = data.record.products ? data.record : { profile: {}, socials: {}, categories: defaultCategories, products: [] };

            if(!cloudData.categories || cloudData.categories.length === 0) {
                cloudData.categories = defaultCategories;
            }

            document.getElementById('ownerName').value = cloudData.profile.name || "";
            document.getElementById('ownerAvatar').value = cloudData.profile.avatar || "";
            document.getElementById('ownerSecure').value = cloudData.profile.secure || "";
            document.getElementById('copyrightTxt').value = cloudData.profile.copyright || "";

            if(cloudData.socials) {
                document.getElementById('socFb').value = cloudData.socials.fb || "";
                document.getElementById('showFb').value = cloudData.socials.showFb !== false ? "true" : "false";
                document.getElementById('socTt').value = cloudData.socials.tt || "";
                document.getElementById('showTt').value = cloudData.socials.showTt !== false ? "true" : "false";
                document.getElementById('socIg').value = cloudData.socials.ig || "";
                document.getElementById('showIg').value = cloudData.socials.showIg !== false ? "true" : "false";
                document.getElementById('socYt').value = cloudData.socials.yt || "";
                document.getElementById('showYt').value = cloudData.socials.showYt !== false ? "true" : "false";
            }

            renderCategoryDropdown();
            renderCategoryManagerList();
            renderAdminList();
        } catch (err) {
            document.getElementById('currentProductsList').innerHTML = "Lỗi kết nối kho mây.";
        }
    }

    function renderCategoryDropdown() {
        const select = document.getElementById('pCategorySelect');
        select.innerHTML = '';
        (cloudData.categories || []).forEach(c => {
            if(!['all', 'discount50', 'freeship', 'under10'].includes(c.name)) {
                let catVal = c.name || c.label;
                select.innerHTML += `<option value="${catVal}">${c.icon || '📁'} ${catVal}</option>`;
            }
        });
    }

    function renderCategoryManagerList() {
        const div = document.getElementById('categoryListAdmin');
        div.innerHTML = '';
        (cloudData.categories || []).forEach((c, index) => {
            let isDefault = ['all', 'discount50', 'freeship', 'under10'].includes(c.name);
            let nameDisp = isDefault ? `[Mặc định hệ thống] ${c.label}` : `${c.icon || '📁'} <b>${c.name}</b>`;
            
            let actions = isDefault ? `<span style="color:#747d8c; font-size:11px;">Cố định</span>` : `
                <button class="btn-edit" onclick="startEditCat(${index})" style="padding:4px 8px; font-size:11px;">✏️ Sửa</button>
                <button class="btn-del" onclick="deleteCategory(${index})" style="padding:4px 8px; font-size:11px;">🗑️ Xóa</button>
            `;

            div.innerHTML += `
                <div class="admin-item">
                    <span>${nameDisp}</span>
                    <div class="btn-action-group">${actions}</div>
                </div>
            `;
        });
    }

    async function saveCategoryAction() {
        let name = document.getElementById('catName').value.trim();
        let icon = document.getElementById('catIcon').value.trim() || '📁';
        if(!name) { alert("Vui lòng nhập tên danh mục!"); return; }

        if(editCatIndex > -1) {
            cloudData.categories[editCatIndex].name = name;
            cloudData.categories[editCatIndex].icon = icon;
            await saveToCloud("Đã cập nhật danh mục thành công!");
            cancelCatEdit();
        } else {
            cloudData.categories.push({ name, icon });
            document.getElementById('catName').value = '';
            document.getElementById('catIcon').value = '';
            await saveToCloud("Đã thêm danh mục mới!");
        }
    }

    function startEditCat(index) {
        editCatIndex = index;
        let c = cloudData.categories[index];
        document.getElementById('catName').value = c.name || '';
        document.getElementById('catIcon').value = c.icon || '';
        document.getElementById('catFormTitle').innerText = "✏️ Đang Sửa Danh Mục";
        document.getElementById('btnSaveCat').innerText = "💾 Lưu Thay Đổi Danh Mục";
        document.getElementById('btnSaveCat').style.background = "#f39c12";
        document.getElementById('btnCancelCat').style.display = 'block';
    }

    function cancelCatEdit() {
        editCatIndex = -1;
        document.getElementById('catName').value = '';
        document.getElementById('catIcon').value = '';
        document.getElementById('catFormTitle').innerText = "📂 Quản Lý Danh Mục (Thêm / Sửa / Xóa)";
        document.getElementById('btnSaveCat').innerText = "➕ Thêm Danh Mục Mới";
        document.getElementById('btnSaveCat').style.background = "#0984e3";
        document.getElementById('btnCancelCat').style.display = 'none';
    }

    async function deleteCategory(index) {
        if(!confirm("Bạn có chắc chắn muốn xóa danh mục này không?")) return;
        cloudData.categories.splice(index, 1);
        await saveToCloud("Đã xóa danh mục!");
    }

    function autoCalculateBadge() {
        let mainNum = parseFloat(document.getElementById('pMainPrice').value.replace(',', '.'));
        let subNum = parseFloat(document.getElementById('pSubPrice').value.replace(',', '.'));
        if(mainNum && subNum && subNum > mainNum) {
            let discount = Math.round(((subNum - mainNum) / subNum) * 100);
            document.getElementById('pBadge').value = `${discount}% OFF`;
        }
    }

    function renderAdminList() {
        const listDiv = document.getElementById('currentProductsList');
        listDiv.innerHTML = '';
        if (!cloudData.products || cloudData.products.length === 0) {
            listDiv.innerHTML = "<p style='color:#888;'>Chưa có sản phẩm nào.</p>"; return;
        }
        
        cloudData.products.forEach((p, index) => {
            let pinIcon = p.pinned ? "📍 Bỏ ghim" : "📌 Ghim";
            let pinBg = p.pinned ? "#27ae60" : "#34495e";
            let borderStyle = p.pinned ? "border: 1px solid #f1c40f; box-shadow: 0 0 10px rgba(241,196,15,0.2);" : "";
            
            listDiv.innerHTML += `
                <div class="admin-item" style="${borderStyle}">
                    <div class="item-info">
                        <img class="item-img" src="${p.image || 'https://via.placeholder.com/45'}" alt="Thumb">
                        <div class="item-text">
                            <b style="color:${p.pinned ? '#f1c40f' : '#fff'};">${p.pinned ? '📌 ' : ''}${p.title}</b>
                            <span style="color:#a4b0be; font-size:11px;">[${p.category || 'Khác'}] | Giá: $${p.mainPrice}</span>
                        </div>
                    </div>
                    <div class="btn-action-group">
                        <button style="background:${pinBg}; color:#fff; border:none; padding:6px; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="togglePin(${index})">${pinIcon}</button>
                        <button class="btn-edit" onclick="startEdit(${index})">✏️</button>
                        <button class="btn-del" onclick="deleteProduct(${index})">🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    async function togglePin(index) {
        cloudData.products[index].pinned = !cloudData.products[index].pinned;
        await saveToCloud(cloudData.products[index].pinned ? "Đã ghim sản phẩm!" : "Đã bỏ ghim!");
    }

    function startEdit(index) {
        editIndex = index; let p = cloudData.products[index];
        document.getElementById('pCategorySelect').value = p.category || '';
        document.getElementById('pTitle').value = p.title || '';
        document.getElementById('pMainPrice').value = p.mainPrice || '';
        document.getElementById('pSubPrice').value = p.subPrice || '';
        document.getElementById('pBadge').value = p.badge || '';
        document.getElementById('pImage').value = p.image || '';
        document.getElementById('pLink').value = p.link || '';

        document.getElementById('formTitle').innerText = "✏️ Đang Chỉnh Sửa Sản Phẩm";
        document.getElementById('formTitle').style.color = "#f39c12";
        let btn = document.getElementById('btnSubmitProduct');
        btn.innerText = "💾 Lưu Thay Đổi Sản Phẩm"; btn.style.background = "#f39c12";
        document.getElementById('btnCancelEdit').style.display = 'block';
        document.getElementById('productFormSection').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function cancelEdit() {
        editIndex = -1;
        document.getElementById('pTitle').value = ''; document.getElementById('pMainPrice').value = '';
        document.getElementById('pSubPrice').value = ''; document.getElementById('pBadge').value = '';
        document.getElementById('pImage').value = ''; document.getElementById('pLink').value = '';

        document.getElementById('formTitle').innerText = "📦 Thêm Sản Phẩm Mới";
        document.getElementById('formTitle').style.color = "#a4b0be";
        let btn = document.getElementById('btnSubmitProduct');
        btn.innerText = "➕ Thêm Sản Phẩm Lên Mây"; btn.style.background = "#ff4757";
        document.getElementById('btnCancelEdit').style.display = 'none';
    }

    async function saveProductAction() {
        let category = document.getElementById('pCategorySelect').value || 'Khác';
        let rawMain = document.getElementById('pMainPrice').value.trim();
        let rawSub = document.getElementById('pSubPrice').value.trim();

        if(!document.getElementById('pTitle').value || !document.getElementById('pLink').value) {
            alert("Vui lòng điền tên và link sản phẩm!"); return;
        }

        if(!cloudData.products) cloudData.products = [];

        if(editIndex > -1) {
            cloudData.products[editIndex].category = category;
            cloudData.products[editIndex].title = document.getElementById('pTitle').value;
            cloudData.products[editIndex].mainPrice = rawMain;
            cloudData.products[editIndex].subPrice = rawSub;
            cloudData.products[editIndex].badge = document.getElementById('pBadge').value || "SALE";
            cloudData.products[editIndex].image = document.getElementById('pImage').value;
            cloudData.products[editIndex].link = document.getElementById('pLink').value;
            await saveToCloud("Đã cập nhật sản phẩm!");
            cancelEdit();
        } else {
            let randomRating = (Math.random() * (5.0 - 4.8) + 4.8).toFixed(1);
            if(randomRating === "5.0") randomRating = "4.9";
            let randomSold = Math.floor(Math.random() * 14 + 2) + "k+";

            const newItem = {
                id: Date.now(),
                category: category,
                title: document.getElementById('pTitle').value,
                image: document.getElementById('pImage').value,
                link: document.getElementById('pLink').value,
                mainPrice: rawMain,
                subPrice: rawSub,
                badge: document.getElementById('pBadge').value || "SALE",
                rating: randomRating,
                sold: randomSold,
                pinned: false
            };
            cloudData.products.unshift(newItem);
            await saveToCloud("Thêm sản phẩm thành công!");
            cancelEdit();
        }
    }

    async function deleteProduct(index) {
        if(!confirm("Bạn có chắc chắn muốn xóa sản phẩm này không?")) return;
        cloudData.products.splice(index, 1);
        if(editIndex === index) cancelEdit();
        await saveToCloud("Đã xóa sản phẩm!");
    }

    async function updateProfile() {
        if(!cloudData.profile) cloudData.profile = {};
        cloudData.profile.name = document.getElementById('ownerName').value;
        cloudData.profile.avatar = document.getElementById('ownerAvatar').value;
        cloudData.profile.secure = document.getElementById('ownerSecure').value;
        cloudData.profile.copyright = document.getElementById('copyrightTxt').value;
        await saveToCloud("Đã lưu thông tin Bio!");
    }

    async function updateSocials() {
        if(!cloudData.socials) cloudData.socials = {};
        cloudData.socials.fb = document.getElementById('socFb').value;
        cloudData.socials.showFb = document.getElementById('showFb').value === "true";
        cloudData.socials.tt = document.getElementById('socTt').value;
        cloudData.socials.showTt = document.getElementById('showTt').value === "true";
        cloudData.socials.ig = document.getElementById('socIg').value;
        cloudData.socials.showIg = document.getElementById('showIg').value === "true";
        cloudData.socials.yt = document.getElementById('socYt').value;
        cloudData.socials.showYt = document.getElementById('showYt').value === "true";
        await saveToCloud("Đã lưu mạng xã hội!");
    }

    async function saveToCloud(msg) {
        document.getElementById('loadingText').style.display = 'block';
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify(cloudData)
            });
            alert(msg); 
            renderCategoryDropdown();
            renderCategoryManagerList();
            renderAdminList();
