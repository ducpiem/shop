<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achadinhos do Brasil - Ofertas Exclusivas</title>
    <style>
        :root { --primary-red: #ff4757; --ali-red: #ff6b81; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        
        /* Nền Dark Mode Sao Trời huyền ảo theo đúng yêu cầu */
        body { 
            background: radial-gradient(circle at 80% 80%, #29183b 0%, #0c0d14 60%, #050608 100%);
            background-attachment: fixed;
            display: flex; justify-content: center; min-height: 100vh; color: #fff;
        }
        
        .container { width: 100%; max-width: 480px; background: rgba(18, 20, 29, 0.85); backdrop-filter: blur(14px); min-height: 100vh; padding-bottom: 30px; box-shadow: 0 0 35px rgba(0,0,0,0.7); border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px 0 20px; }
        .lang-select { padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; }

        /* PHẦN BIO TO & NỔI BẬT */
        .header { text-align: center; padding: 10px 20px 20px 20px; }
        .avatar { width: 95px; height: 95px; border-radius: 50%; object-fit: cover; border: 3px solid #ff4757; box-shadow: 0 0 20px rgba(255,71,87,0.4); margin-bottom: 12px; }
        .owner-name { font-size: 24px; font-weight: 900; color: #ffffff; letter-spacing: 0.5px; margin-bottom: 6px; }
        .secure-text { font-size: 12px; color: #2ed573; font-weight: 700; background: rgba(46,213,115,0.12); display: inline-block; padding: 5px 14px; border-radius: 15px; border: 1px solid rgba(46,213,115,0.3); }

        /* ICON MẠNG XÃ HỘI */
        .social-links { display: flex; justify-content: center; gap: 12px; margin: 15px 0 20px 0; }
        .social-icon { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; color: #fff; text-decoration: none; font-size: 16px; border: 1px solid rgba(255,255,255,0.15); transition: 0.2s; }
        .social-icon:hover { background: var(--primary-red); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,71,87,0.4); }

        /* DANH MỤC TAB */
        .category-tabs { display: flex; justify-content: center; gap: 8px; padding: 0 15px 20px 15px; overflow-x: auto; }
        .tab-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #a4b0be; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active { background: var(--primary-red); color: white; border-color: transparent; box-shadow: 0 4px 15px rgba(255,71,87,0.4); }

        /* LƯỚI SẢN PHẨM */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px; flex-grow: 1; }
        
        .product-card { 
            background: rgba(26, 29, 41, 0.9); border-radius: 12px; overflow: hidden; text-decoration: none; 
            display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3); transition: 0.3s; position: relative;
        }
        .product-card:hover { transform: translateY(-4px); border-color: rgba(255,71,87,0.5); box-shadow: 0 10px 25px rgba(255, 71, 87, 0.25); }

        .img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden; }
        .product-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.95; }
        .badge-discount { position: absolute; top: 8px; left: 8px; background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; box-shadow: 0 2px 8px rgba(255,71,87,0.5); }

        .product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 13px; color: #f1f2f6; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; line-height: 1.3; }

        .rating-sold { font-size: 11px; color: #a4b0be; margin-bottom: 6px; display: flex; align-items: center; gap: 3px; }
        .star-icon { color: #f39c12; }

        .price-main { font-size: 17px; font-weight: 950; color: #ffffff; margin-bottom: 1px; }
        .price-sub { font-size: 11px; color: #ff6b81; text-decoration: line-through; margin-bottom: 6px; }
        .shipping-tag { font-size: 10px; color: #2ed573; font-weight: bold; margin-bottom: 10px; }

        .buy-btn { 
            background: linear-gradient(135deg, #ff4757, #ff3838); color: white; text-align: center; 
            padding: 10px 0; border-radius: 8px; font-size: 12px; font-weight: 900; letter-spacing: 0.5px;
            margin-top: auto; box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4); animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.6); }
            50% { transform: scale(1.02); box-shadow: 0 0 12px 4px rgba(255, 71, 87, 0.4); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        /* CHÂN TRANG COPYRIGHT */
        .footer { text-align: center; padding: 25px 15px 10px 15px; font-size: 11px; color: #747d8c; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 30px; }
        .loading-msg { grid-column: span 2; text-align: center; padding: 40px; color: #a4b0be; font-weight: bold; }
    </style>
    <!-- Thư viện FontAwesome hỗ trợ icon mạng xã hội -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="top-bar">
        <span></span>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="vi">🇻🇳 Tiếng Việt</option>
            <option value="pt">🇧🇷 Português</option>
            <option value="en">🇺🇸 English</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
        </select>
    </div>

    <div class="header">
        <img class="avatar" id="ownerAvatarImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80" alt="Profile">
        <div class="owner-name" id="ownerNameTxt">Achadinhos do Brasil 🇧🇷</div>
        <div class="secure-text" id="txtSecure">🔒 100% Seguro • Verificado</div>
        
        <!-- Các icon mạng xã hội động -->
        <div class="social-links" id="socialLinksContainer"></div>
    </div>

    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)" id="tabAll">🔥 Todos</button>
        <button class="tab-btn" onclick="filterCategory('hot', this)" id="tabHot">⚡ Hot Sale</button>
        <button class="tab-btn" onclick="filterCategory('util', this)" id="tabUtil">💧 Utilidades</button>
        <button class="tab-btn" onclick="filterCategory('tech', this)" id="tabTech">⌚ Eletrônicos</button>
    </div>

    <div id="productGrid" class="product-grid">
        <div class="loading-msg" id="loadText">Carregando ofertas da nuvem... 🔄</div>
    </div>

    <div class="footer" id="footerCopyright">
        © 2026 Achadinhos do Brasil. All Rights Reserved.
    </div>
</div>

<script>
    const BIN_ID = "6abf8b69ffd5d1605345a07d";
    const MASTER_KEY = "$2a$10$ka6PM2vVBDDaDoirSLIys.sa0GccPv63vO5SIH936dSZh3tu4O.Sq";
    
    let globalData = { profile: {}, socials: {}, products: [] };
    let activeCategory = 'all';

    const translations = {
        vi: { all: "🔥 Tất cả", hot: "⚡ Hot Sale", util: "💧 Tiện ích", tech: "⌚ Điện tử", shipping: "⚡ Miễn phí vận chuyển", buy: "MUA NGAY 🛒", loading: "Đang tải ưu đãi từ mây... 🔄", empty: "Không tìm thấy sản phẩm nào." },
        pt: { all: "🔥 Todos", hot: "⚡ Hot Sale", util: "💧 Utilidades", tech: "⌚ Eletrônicos", shipping: "⚡ Frete Grátis", buy: "COMPRAR AGORA 🛒", loading: "Carregando ofertas da nuvem... 🔄", empty: "Nenhum produto encontrado." },
        en: { all: "🔥 All Items", hot: "⚡ Hot Sale", util: "Utilities", tech: "⌚ Electronics", shipping: "⚡ Free Shipping", buy: "BUY NOW 🛒", loading: "Loading offers from cloud... 🔄", empty: "No products found." },
        fr: { all: "🔥 Tous", hot: "⚡ Vente Flash", util: "💧 Utilitaires", tech: "⌚ Électronique", shipping: "⚡ Livraison Gratuite", buy: "ACHETER 🛒", loading: "Chargement depuis le cloud... 🔄", empty: "Aucun produit trouvé." },
        es: { all: "🔥 Todos", hot: "⚡ Súper Ofertas", util: "💧 Utilidades", tech: "⌚ Electrónica", shipping: "⚡ Envío Gratis", buy: "COMPRAR AHORA 🛒", loading: "Cargando ofertas de la nube... 🔄", empty: "No se encontraron productos." }
    };

    // Khôi phục ngôn ngữ đã lưu hoặc mặc định là Tiếng Việt
    function initLanguage() {
        let savedLang = localStorage.getItem('user_lang');
        if(savedLang && translations[savedLang]) {
            document.getElementById('langSelect').value = savedLang;
        } else {
            document.getElementById('langSelect').value = 'vi'; // Mặc định Tiếng Việt cho tiện
            localStorage.setItem('user_lang', 'vi');
        }
    }

    function changeLanguage() {
        let lang = document.getElementById('langSelect').value;
        localStorage.setItem('user_lang', lang);
        renderGrid();
    }

    async function fetchDataFromCloud() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${Date.now()}`, {
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            let data = await res.json();
            
            let record = data.record || {};
            globalData.products = record.products || [];
            globalData.profile = record.profile || {};
            globalData.socials = record.socials || {};
            
            // Cập nhật Profile
            if(globalData.profile.name) document.getElementById('ownerNameTxt').innerText = globalData.profile.name;
            if(globalData.profile.avatar) document.getElementById('ownerAvatarImg').src = globalData.profile.avatar;
            if(globalData.profile.secure) document.getElementById('txtSecure').innerText = globalData.profile.secure;
            if(globalData.profile.copyright) document.getElementById('footerCopyright').innerText = globalData.profile.copyright;

            // Render Social Icons
            renderSocials();

            renderGrid();
        } catch (err) {
            console.error(err);
            document.getElementById('productGrid').innerHTML = `<div class="loading-msg" style="color:#ff4757;">Erro ao carregar dados da nuvem.</div>`;
        }
    }

    function renderSocials() {
        const s = globalData.socials;
        const container = document.getElementById('socialLinksContainer');
        container.innerHTML = '';

        if(s.ig) container.innerHTML += `<a href="${s.ig}" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>`;
        if(s.tt) container.innerHTML += `<a href="${s.tt}" target="_blank" class="social-icon"><i class="fab fa-tiktok"></i></a>`;
        if(s.yt) container.innerHTML += `<a href="${s.yt}" target="_blank" class="social-icon"><i class="fab fa-youtube"></i></a>`;
        if(s.wa) container.innerHTML += `<a href="${s.wa}" target="_blank" class="social-icon"><i class="fab fa-whatsapp"></i></a>`;
    }

    function filterCategory(cat, btn) {
        activeCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
    }

    function renderGrid() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang];

        document.getElementById('tabAll').innerText = t.all;
        document.getElementById('tabHot').innerText = t.hot;
        document.getElementById('tabUtil').innerText = t.util;
        document.getElementById('tabTech').innerText = t.tech;

        const gridContainer = document.getElementById('productGrid');
        gridContainer.innerHTML = '';

        const products = globalData.products || [];
        const filtered = activeCategory === 'all' ? products : products.filter(p => p.category === activeCategory);

        if(filtered.length === 0) {
            gridContainer.innerHTML = `<p style="grid-column: span 2; text-align:center; color:#a4b0be; padding: 25px;">${t.empty}</p>`;
            return;
        }

        filtered.forEach(p => {
            gridContainer.innerHTML += `
                <a href="${p.link}" target="_blank" class="product-card">
                    <div class="img-wrap">
                        <img class="product-img" src="${p.image}" alt="${p.title}" loading="lazy">
                        <span class="badge-discount">${p.badge || 'SALE'}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="rating-sold">
                            <span class="star-icon">★</span> <b>${p.rating || '4.9'}</b> (${p.sold || '1k+'})
                        </div>
                        <div class="price-main">${p.mainPrice}</div>
                        <div class="price-sub">${p.subPrice}</div>
                        <div class="shipping-tag">${t.shipping}</div>
                        <div class="buy-btn">${t.buy}</div>
                    </div>
                </a>
            `;
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initLanguage();
        fetchDataFromCloud();
    });
</script>
</body>
</html>
